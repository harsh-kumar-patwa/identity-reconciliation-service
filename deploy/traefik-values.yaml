# Runs on the control-plane node, which kind maps to ports 80 and 443 on the laptop.
service:
  type: ClusterIP
ports:
  web:
    hostPort: 80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    hostPort: 443
nodeSelector:
  ingress-ready: "true"
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
ingressRoute:
  dashboard:
    enabled: false
providers:
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: false
  kubernetesCRD:
    enabled: false
# Only one node can hold hostPort 80/443, so the old pod must stop before the new one can start.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0
# Writes 127.0.0.1 (the kind port mapping) into each Ingress status.
# Argo CD only marks an Ingress healthy once it has an address there.
additionalArguments:
  - --providers.kubernetesingress.ingressendpoint.ip=127.0.0.1
