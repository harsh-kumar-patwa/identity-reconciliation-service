{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  labels:
    {{- include "identity.labels" . | nindent 4 }}
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        # Only public paths. /metrics and the probes stay inside the cluster.
        paths:
          {{- range list "/identify" "/version" "/health" }}
          - path: {{ . }}
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  name: http
          {{- end }}
{{- end }}
